name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived Vercel Remote Cache token
    env:
      # Only main writes to the shared cache. Pull requests read from it, so
      # a branch can't plant cache entries that later runs would replay.
      TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # fallow reads git history for churn
      # Skipped until the TURBO_TEAM variable is set, and for pull requests
      # from forks, which can't get an OIDC token. The cache only saves time,
      # so a Vercel failure logs an error and the job carries on without it.
      - if: vars.TURBO_TEAM != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses:vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ericchernuka/react-usher exec playwright install --with-deps chromium webkit
      - run: pnpm check

  # Audits the workflows themselves for unsafe patterns.
  zizmor:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          version: 1.33.1
