# On every push to main, Changesets either opens/updates a "Version Packages"
# pull request (when changesets are pending) or, once that PR is merged,
# publishes the new versions to npm. Publishing uses npm trusted publishing,
# so no npm token is stored in the repository.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
      # The packages share one version, so publish one GitHub release per
      # version instead of one per package. GitHub writes the notes from the
      # pull requests merged since the previous release.
      - if: steps.changesets.outputs.published == 'true'
        run: gh release create "v$(node -p "require('./packages/usher-core/package.json').version")" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
